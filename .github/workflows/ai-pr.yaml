name: AI PR Description

on:
   pull_request:
      types:
         - opened
         - synchronize
         - reopened

   workflow_run:
      workflows:
         - 'Client CI'
         - 'Server CI'
      types:
         - completed

permissions:
   contents: read
   pull-requests: write
   checks: read

jobs:
   generate-description:
      name: Generate AI PR Description
      runs-on: ubuntu-latest

      steps:
         - name: Resolve PR number and head SHA
           id: pr
           uses: actions/github-script@v9
           with:
              script: |
                 let number, sha;

                 if (context.eventName === "pull_request") {
                   number = context.payload.pull_request.number;
                   sha = context.payload.pull_request.head.sha;
                 } else {
                   const run = context.payload.workflow_run;
                   sha = run.head_sha;

                   const prs = run.pull_requests || [];

                   if (prs.length > 0) {
                     number = prs[0].number;
                   } else {
                     const { data } = await github.rest.pulls.list({
                       owner: context.repo.owner,
                       repo: context.repo.repo,
                       state: "open",
                       head: `${context.repo.owner}:${run.head_branch}`
                     });

                     if (data.length > 0) {
                       number = data[0].number;
                     }
                   }
                 }

                 if (!number) {
                   core.notice(
                     "No open PR associated with this run — skipping."
                   );

                   core.setOutput("skip", "true");
                   return;
                 }

                 // Double check the PR is still open.
                 const { data: pr } = await github.rest.pulls.get({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   pull_number: number
                 });

                 if (pr.state !== "open") {
                   core.notice(
                     `PR #${number} is ${pr.state} — skipping.`
                   );

                   core.setOutput("skip", "true");
                   return;
                 }

                 core.setOutput("skip", "false");
                 core.setOutput("number", number);
                 core.setOutput("sha", sha);

         - name: Get Client/Server CI results
           id: ci
           if: steps.pr.outputs.skip != 'true'
           uses: actions/github-script@v9
           env:
              HEAD_SHA: ${{ steps.pr.outputs.sha }}
           with:
              script: |
                 const sha = process.env.HEAD_SHA;

                 const { data } = await github.rest.checks.listForRef({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   ref: sha,
                   per_page: 100
                 });

                 function outcomeFor(jobName) {
                   const run = data.check_runs.find(
                     c => c.name === jobName
                   );

                   if (!run) return "not_run";

                   if (run.status !== "completed") {
                     return "pending";
                   }

                   return run.conclusion;
                 }

                 core.setOutput(
                   "client",
                   outcomeFor("client")
                 );

                 core.setOutput(
                   "server",
                   outcomeFor("server")
                 );

         - name: Get PR diff
           if: steps.pr.outputs.skip != 'true' && github.event_name == 'pull_request'
           env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
           run: |
              gh pr diff \
                ${{ steps.pr.outputs.number }} \
                > pr.diff

         - name: Get PR commits
           if: steps.pr.outputs.skip != 'true' && github.event_name == 'pull_request'
           env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
           run: |
              gh pr view \
                ${{ steps.pr.outputs.number }} \
                --json commits \
                --jq '.commits[] | .messageHeadline' \
                > pr.commits

         - name: Generate description with Gemini
           if: steps.pr.outputs.skip != 'true' && github.event_name == 'pull_request'
           env:
              GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              PR_TITLE: ${{ github.event.pull_request.title }}
           run: |
              node <<'EOF'
              (async () => {
                const fs = require("fs");

                const diff = fs.readFileSync("pr.diff", "utf8");
                const commits = fs.readFileSync("pr.commits", "utf8");

                // Prevent extremely large PRs from exceeding the model context.
                const MAX_DIFF_LENGTH = 50000;
                const MAX_COMMITS_LENGTH = 15000;

                const truncatedDiff =
                  diff.length > MAX_DIFF_LENGTH
                    ? diff.slice(0, MAX_DIFF_LENGTH) +
                      "\n\n[DIFF TRUNCATED]"
                    : diff;

                const truncatedCommits =
                  commits.length > MAX_COMMITS_LENGTH
                    ? commits.slice(0, MAX_COMMITS_LENGTH) +
                      "\n\n[COMMIT HISTORY TRUNCATED]"
                    : commits;

                const prompt = `
              You are a senior software engineer generating a GitHub Pull Request description.

              Analyze THREE sources of information:

              1. PR TITLE
              2. COMMIT MESSAGES
              3. CODE DIFF

              The commit messages describe the developer's intended work.
              The code diff shows what was actually changed.

              Use the commit messages to understand the overall scope and intent,
              and use the code diff to verify and describe the implementation.

              Do NOT simply convert every commit into a bullet point.
              Group related changes into meaningful categories.

              PR TITLE:
              ${process.env.PR_TITLE}

              COMMIT MESSAGES:
              ${truncatedCommits}

              CODE DIFF:
              ${truncatedDiff}

              Generate a concise but informative Pull Request description.

              IMPORTANT RULES:

              - Describe the actual scope of the PR.
              - Use commit messages to identify high-level features and intent.
              - Use the code diff to verify those changes.
              - Do not invent functionality that is not supported by the commit
                messages or code diff.
              - Do not claim something was implemented if there is no evidence
                of it in the provided information.
              - Do not claim tests were executed merely because test files exist.
              - If the commits mention tests being added, describe them as
                tests added/implemented, not tests passed.
              - Do not mention unrelated code.
              - Do not list every commit individually.
              - Combine closely related changes into a single bullet.
              - Prioritize meaningful functionality over minor implementation details.
              - Include important database/schema changes.
              - Include important backend/API changes.
              - Include authentication/authorization/security changes.
              - Include important utilities or infrastructure changes.
              - Include testing changes when they are part of the PR.
              - Keep the summary to 1-2 sentences.
              - Keep the changes section to approximately 5-10 important points.
              - Make each change bullet describe a meaningful area of work.
              - Use clear, professional technical language.
              - Do not use emojis.
              - Do not mention this AI prompt or the generation process.

              The output must summarize the PR as a whole, not just the database
              migration or the most obvious part of the diff.
              `;

                const response = await fetch(
                  "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent",
                  {
                    method: "POST",

                    headers: {
                      "Content-Type": "application/json",
                      "x-goog-api-key": process.env.GEMINI_API_KEY
                    },

                    body: JSON.stringify({
                      contents: [
                        {
                          parts: [
                            {
                              text: prompt
                            }
                          ]
                        }
                      ],

                      generationConfig: {
                        responseMimeType: "application/json",

                        responseSchema: {
                          type: "object",

                          properties: {
                            summary: {
                              type: "string"
                            },

                            changes: {
                              type: "array",

                              items: {
                                type: "string"
                              }
                            }
                          },

                          required: [
                            "summary",
                            "changes"
                          ]
                        }
                      }
                    })
                  }
                );

                if (!response.ok) {
                  const error = await response.text();

                  throw new Error(
                    `Gemini API request failed: ${error}`
                  );
                }

                const data = await response.json();

                const output =
                  data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (!output) {
                  throw new Error(
                    "Gemini returned an empty response."
                  );
                }

                const result = JSON.parse(output);

                if (
                  typeof result.summary !== "string" ||
                  !Array.isArray(result.changes)
                ) {
                  throw new Error(
                    "Gemini returned an invalid response."
                  );
                }

                fs.writeFileSync(
                  "ai-description.json",
                  JSON.stringify(result, null, 2)
                );
              })().catch(err => {
                console.error(err);
                process.exit(1);
              });
              EOF

         - name: Build fragments
           if: steps.pr.outputs.skip != 'true'
           env:
              CLIENT_OUTCOME: ${{ steps.ci.outputs.client }}
              SERVER_OUTCOME: ${{ steps.ci.outputs.server }}
              HAS_AI: ${{ github.event_name == 'pull_request' }}
           run: |
              node <<'EOF'
              const fs = require("fs");

              const box = (outcome) =>
                outcome === "success" ? "[x]" : "[ ]";

              const label = (outcome) => {
                switch (outcome) {
                  case "success":
                    return "passed";

                  case "failure":
                    return "failed";

                  case "cancelled":
                    return "cancelled";

                  case "pending":
                    return "running…";

                  case "not_run":
                    return "not run (no relevant changes)";

                  default:
                    return outcome;
                }
              };

              const client = process.env.CLIENT_OUTCOME;
              const server = process.env.SERVER_OUTCOME;

              const testingFragment = `<!-- AI-PR-TESTING:START -->
              ## Testing

              - [ ] Tested locally (manual)
              - ${box(client)} Client CI — ${label(client)}
              - ${box(server)} Server CI — ${label(server)}
              <!-- AI-PR-TESTING:END -->`;

              fs.writeFileSync(
                "testing-fragment.md",
                testingFragment
              );

              if (
                process.env.HAS_AI === "true" &&
                fs.existsSync("ai-description.json")
              ) {
                const ai = JSON.parse(
                  fs.readFileSync(
                    "ai-description.json",
                    "utf8"
                  )
                );

                const aiFragment = `<!-- AI-PR-DESCRIPTION:START -->
              ## 🤖 AI Pull Request Summary

              ### Summary

              ${ai.summary}

              ### Changes

              ${ai.changes
                .map(change => `- ${change}`)
                .join("\n")}

              <!-- AI-PR-DESCRIPTION:END -->`;

                fs.writeFileSync(
                  "ai-summary-fragment.md",
                  aiFragment
                );
              }
              EOF

         - name: Update PR
           if: steps.pr.outputs.skip != 'true'
           uses: actions/github-script@v9
           env:
              PR_NUMBER: ${{ steps.pr.outputs.number }}
           with:
              script: |
                 const fs = require("fs");

                 const prNumber =
                   Number(process.env.PR_NUMBER);

                 const { data: pr } =
                   await github.rest.pulls.get({
                     owner: context.repo.owner,
                     repo: context.repo.repo,
                     pull_number: prNumber
                   });

                 let body = pr.body || "";

                 function replaceOrInsert(
                   body,
                   startMarker,
                   endMarker,
                   fragment,
                   appendAtEnd
                 ) {
                   const startIdx =
                     body.indexOf(startMarker);

                   const endIdx =
                     body.indexOf(endMarker);

                   if (
                     startIdx !== -1 &&
                     endIdx !== -1 &&
                     endIdx > startIdx
                   ) {
                     const before =
                       body.slice(0, startIdx);

                     const after =
                       body.slice(
                         endIdx + endMarker.length
                       );

                     return `${before}${fragment}${after}`;
                   }

                   return appendAtEnd
                     ? `${body}\n\n${fragment}`
                     : `${fragment}\n\n${body}`;
                 }


                 if (
                   fs.existsSync(
                     "ai-summary-fragment.md"
                   )
                 ) {
                   const aiFragment =
                     fs.readFileSync(
                       "ai-summary-fragment.md",
                       "utf8"
                     );

                   body = replaceOrInsert(
                     body,
                     "<!-- AI-PR-DESCRIPTION:START -->",
                     "<!-- AI-PR-DESCRIPTION:END -->",
                     aiFragment,
                     false
                   );
                 }


                 const testingFragment =
                   fs.readFileSync(
                     "testing-fragment.md",
                     "utf8"
                   );

                 body = replaceOrInsert(
                   body,
                   "<!-- AI-PR-TESTING:START -->",
                   "<!-- AI-PR-TESTING:END -->",
                   testingFragment,
                   true
                 );


                 if (!body.includes("## Notes")) {
                   body += "\n\n## Notes\n<!-- Add additional context here. -->\n";
                 }

                 await github.rest.pulls.update({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   pull_number: prNumber,
                   body
                 });
