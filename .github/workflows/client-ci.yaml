name: Client CI

on:
   pull_request:
      paths:
         - 'client/**'
         - '.github/workflows/client-ci.yml'
   push:
      branches:
         - main
      paths:
         - 'client/**'
         - '.github/workflows/client-ci.yml'

jobs:
   client:
      runs-on: ubuntu-latest

      defaults:
         run:
            working-directory: client

      steps:
         - name: Checkout
           uses: actions/checkout@v5

         - name: Setup Node.js
           uses: actions/setup-node@v5
           with:
              node-version: 24
              cache: npm
              cache-dependency-path: client/package-lock.json

         - name: Install dependencies
           run: npm ci

         - name: Lint
           run: npm run lint

         - name: Format check
           run: npm run format:check

         - name: Build
           run: npm run build
